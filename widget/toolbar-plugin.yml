# Toolbar item: shows the date like @seelen/tb-calendar-popup, but clicking it
# opens this widget's calendar with Google events instead of the built-in one.
id: "@sherlockchiang/tb-gcal-agenda"
metadata:
  displayName:
    en: Date (Google Calendar)
    zh-CN: 日期（Google 日历）
    zh-TW: 日期（Google 日曆）
  description:
    en: Shows the date; click it to open a calendar with your Google Calendar events.
    zh-CN: 显示日期；点击后打开带有 Google 日历日程的日历。
    zh-TW: 顯示日期；點擊後開啟含有 Google 日曆行程的日曆。
icon: FaCalendarAlt
target: "@seelen/fancy-toolbar"
plugin:
  scopes:
    - Date
  template: return date
  onClickV2: |-
    trigger("@sherlockchiang/gcal-agenda");
